      else { r.setAttribute('data-theme-pref', 'system'); }
    })();

</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

          </ul>
          <span class="masthead-div" aria-hidden="true"></span>
          <div class="header-links">

  <main id="main">
    <noscript>
      <!-- Lead with the link that actually works without JavaScript. The
           write-up is rendered by the same client-side viewer as every other
           article here, so it is not a fallback — say so rather than sending
           someone to a second blank page. -->
      <p class="spread"><span class="u-wide">This page renders from a JSON file in the
        browser. Without JavaScript, read that file directly at
        <a href="/content/agents/registry.json">/content/agents/registry.json</a>, or the
        source at <a href="https://github.com/tatra-labs">github.com/tatra-labs</a>. The
        write-up at <code>/project/agent-hub</code> needs JavaScript too.</span></p>
    </noscript>

    <!-- ====================================================================
         THE HUB. One .spread holds every region; each region is .u-wide
         so it spans rail + main, exactly as the home page's list sections do.
         Nothing here is a direct child of .spread without a grid-column.
         ================================================================= -->
    <div class="spread" id="register-view">

      <header class="u-wide identity-inner reg-head">
        <p class="u-label identity-eyebrow">Agents</p>
        <!-- Links to "./" so it clears an active domain or pattern filter and
             returns to the whole register. -->
        <h1 class="identity-name"><a href="./" data-register-home="1">Agent Hub</a></h1>
        <p class="identity-lede" id="reg-lede"></p>
        <dl class="identity-index" id="reg-index"></dl>
      </header>

      <!-- The domain list is authored, not derived from the agents: a domain
           exists whether or not anything has been built in it, which is what
           makes an empty one a stated gap rather than an empty filter. -->
      <section class="u-wide list-section" aria-labelledby="scheme-h">
        <div class="section-head">
          <h2 id="scheme-h">Domains</h2>
          <span class="section-count" id="scheme-count"></span>
        </div>
        <div class="schedule-wrap">
          <table class="schedule">
            <thead>
              <tr>
                <th scope="col">Domain</th>
                <th scope="col">Agents</th>
                <th scope="col">Notes</th>
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
      </section>

      <section class="u-wide list-section" aria-labelledby="holdings-h">
        <div class="section-head">
          <h2 id="holdings-h">Agents</h2>
          <span class="section-count" id="holdings-count"></span>
        </div>

        <div class="control-bar reg-controls hidden" id="reg-controls">
          <div class="chips" id="pattern-chips" role="group" aria-label="Filter by agent pattern"></div>
          <div class="search-wrap hidden" id="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <label for="search-input" class="visually-hidden">Search the agents</label>
            <input type="search" id="search-input" placeholder="Search" autocomplete="off">
          </div>
        </div>

        <p class="reg-legend hidden" id="pattern-gloss"></p>
        <p class="reg-note hidden" id="holdings-note"></p>

        <!-- The site's own live-region idiom (see #result-status on the home
             page): the match count and the empty state change without a
             navigation, so nothing else would announce them. -->
        <p aria-live="polite" id="reg-status"><span class="visually-hidden"></span></p>

        <ol class="register" id="holdings-list"></ol>
        <p class="empty hidden" id="holdings-empty"></p>
      </section>
    </div>

    <!-- ====================================================================
         THE SPECIMEN SHEET. Structurally identical to 404.html's reader, so
         .viewer-shell's explicit grid-rows and the sticky .article-rail both
         apply unchanged: back-link in row 1, rail and #article in row 2.
         ================================================================= -->
    <div class="spread viewer-shell agents-sheet hidden" id="sheet-view">
      <a class="back-link u-wide" id="sheet-back" href="./">&larr; All agents</a>

      <aside class="article-rail" id="sheet-rail" aria-label="Record details"></aside>

      <article id="article">
        <header class="article-hero">
          <p class="u-label article-kicker" id="sheet-kicker"></p>
          <h1 class="article-title" id="sheet-title"></h1>
          <p class="article-sub" id="sheet-sub"></p>
          <!-- Authorship, in the reading column, on every record. -->
          <p class="article-meta" id="sheet-prov"></p>
        </header>

        <div id="sheet-links"></div>
        <div class="article-content" id="sheet-body"></div>

        <nav class="foundation-chapter-nav hidden" id="sheet-nav" aria-label="Register navigation"></nav>

        <div class="article-tags" id="sheet-tags"></div>
      </article>
    </div>

    <p class="spread hidden" id="reg-error"><span class="u-wide"></span></p>
  </main>

  <footer class="site-footer spread">
    <div class="u-wide footer-inner">
      <span>&copy; <span id="footer-year">2026</span> Tatra Labs</span>
      <span class="footer-links">
        <a href="https://github.com/tatra-labs" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com/tatralabs" target="_blank" rel="noopener noreferrer">X</a>
        <a href="/?tab=projects">Projects</a>
        <a href="/">Index</a>
      </span>
    </div>
  </footer>

  <script src="/js/util.js"></script>
  <script src="/project/agents/app.js"></script>
  <script src="/js/theme.js"></script>
</body>

</html>
