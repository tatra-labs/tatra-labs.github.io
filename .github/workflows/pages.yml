# Deploy the site to GitHub Pages.
#
# This replaces the built-in "legacy" Pages pipeline, which stopped firing on
# push in March 2026 and silently discarded manual build requests. Deploying
# from an explicit workflow means a failure shows up in the Actions log
# instead of leaving the site frozen on an old build.
#
# The repo is served as-is: there is no build step, and `.nojekyll` keeps
# Pages from running the vendored files under project/ through Jekyll.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact excludes .git and .github for us.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
